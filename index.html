<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HubSpot Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 { color: #333; }
        .status { background: #4caf50; color: white; padding: 15px; border-radius: 5px; margin: 20px 0; }
        .info { background: #f0f0f0; padding: 15px; border-radius: 5px; margin: 15px 0; text-align: left; }
        .tracking { color: #667eea; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 HubSpot Chatbot</h1>
        <p>Welcome to your HubSpot Chatbot Platform</p>
        
        <div class="status">
            ✅ Website is LIVE and WORKING
        </div>
        
        <div class="info">
            <strong>Status:</strong> Active<br>
            <strong class="tracking">Tracking: ENABLED</strong><br>
            <strong>Platform:</strong> HubSpot Integration
        </div>
        
        <p>Your chatbot is ready to engage with visitors!</p>
    </div>

    <!-- Start of HubSpot Embed Code -->
    <script type="text/javascript" id="hs-script-loader" async defer src="//js-na2.hs-scripts.com/246928158.js"></script>
    <!-- End of HubSpot Embed Code -->
</body>
</html>
